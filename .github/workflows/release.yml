name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb libx11-6
      - name: Install
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: xvfb-run -a .venv/bin/python -m pytest -q
      - name: Build packages
        run: |
          chmod +x packaging/build-deb.sh packaging/build-tarball.sh
          packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
          packaging/build-tarball.sh "${GITHUB_REF_NAME#v}"
          sha256sum dist/*.deb dist/*.tar.gz > dist/SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["video", ".git", "node_modules", "__pycache__", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
